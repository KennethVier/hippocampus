spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://127.0.0.1:${HIPPOCAMPUS_POSTGRES_PORT:5432}/hippocampus
    username: ${HIPPOCAMPUS_POSTGRES_USER:hippocampus}
    password: ${HIPPOCAMPUS_POSTGRES_PASSWORD:hippocampus}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${HIPPOCAMPUS_MATERIAL_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${HIPPOCAMPUS_MATERIAL_UPLOAD_MAX_REQUEST_SIZE:101MB}

hippocampus:
  materials:
    upload:
      max-file-size: ${HIPPOCAMPUS_MATERIAL_UPLOAD_MAX_FILE_SIZE:100MB}
  storage:
    backend: filesystem
    filesystem:
      root: ${HIPPOCAMPUS_STORAGE_ROOT:${user.home}/.hippocampus/objects}
  security:
    cors:
      allowed-origins: ${HIPPOCAMPUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    ecs:
      service:
        environment: local
