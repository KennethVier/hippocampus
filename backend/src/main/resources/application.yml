spring:
  application:
    name: hippocampus-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
  session:
    timeout: ${HIPPOCAMPUS_SESSION_IDLE_TIMEOUT:PT30M}
    jdbc:
      initialize-schema: never

hippocampus:
  materials:
    processing:
      pdf:
        page-batch-size: ${HIPPOCAMPUS_PDF_PAGE_BATCH_SIZE:20}
        max-pages: ${HIPPOCAMPUS_MAX_PDF_PAGES:2000}
        max-native-text-chars-per-page: ${HIPPOCAMPUS_PDF_MAX_NATIVE_TEXT_CHARS_PER_PAGE:1000000}
        ocr-executable: ${HIPPOCAMPUS_TESSERACT_EXECUTABLE:/usr/bin/tesseract}
        ocr-render-dpi: ${HIPPOCAMPUS_OCR_RENDER_DPI:300}
        ocr-max-width-pixels: ${HIPPOCAMPUS_OCR_MAX_WIDTH_PIXELS:10000}
        ocr-max-height-pixels: ${HIPPOCAMPUS_OCR_MAX_HEIGHT_PIXELS:10000}
        ocr-max-pixels: ${HIPPOCAMPUS_OCR_MAX_PIXELS:40000000}
        ocr-max-source-image-dimension: ${HIPPOCAMPUS_OCR_MAX_SOURCE_IMAGE_DIMENSION:8000}
        ocr-max-source-image-pixels: ${HIPPOCAMPUS_OCR_MAX_SOURCE_IMAGE_PIXELS:40000000}
        ocr-max-page-source-image-pixels: ${HIPPOCAMPUS_OCR_MAX_PAGE_SOURCE_IMAGE_PIXELS:80000000}
        ocr-max-input-bytes: ${HIPPOCAMPUS_OCR_MAX_INPUT_BYTES:25000000}
        ocr-max-stdout-bytes: ${HIPPOCAMPUS_OCR_MAX_STDOUT_BYTES:8000000}
        ocr-max-stderr-bytes: ${HIPPOCAMPUS_OCR_MAX_STDERR_BYTES:65536}
        ocr-max-tsv-rows: ${HIPPOCAMPUS_OCR_MAX_TSV_ROWS:200000}
        ocr-max-tsv-field-chars: ${HIPPOCAMPUS_OCR_MAX_TSV_FIELD_CHARS:100000}
        ocr-max-text-chars: ${HIPPOCAMPUS_OCR_MAX_TEXT_CHARS:1000000}
        ocr-timeout: ${HIPPOCAMPUS_OCR_TIMEOUT:PT30S}
        ocr-termination-grace: ${HIPPOCAMPUS_OCR_TERMINATION_GRACE:PT2S}
        visual:
          max-images-per-page: ${HIPPOCAMPUS_PDF_VISUAL_MAX_IMAGES_PER_PAGE:256}
          max-images-per-document: ${HIPPOCAMPUS_PDF_VISUAL_MAX_IMAGES_PER_DOCUMENT:10000}
          max-source-image-dimension: ${HIPPOCAMPUS_PDF_VISUAL_MAX_SOURCE_IMAGE_DIMENSION:8000}
          max-source-image-pixels: ${HIPPOCAMPUS_PDF_VISUAL_MAX_SOURCE_IMAGE_PIXELS:40000000}
          max-page-source-image-pixels: ${HIPPOCAMPUS_PDF_VISUAL_MAX_PAGE_SOURCE_IMAGE_PIXELS:80000000}
          max-document-source-image-pixels: ${HIPPOCAMPUS_PDF_VISUAL_MAX_DOCUMENT_SOURCE_IMAGE_PIXELS:2000000000}
          max-encoded-image-bytes: ${HIPPOCAMPUS_PDF_VISUAL_MAX_ENCODED_IMAGE_BYTES:25000000}
          max-page-encoded-image-bytes: ${HIPPOCAMPUS_PDF_VISUAL_MAX_PAGE_ENCODED_IMAGE_BYTES:100000000}
          max-document-encoded-image-bytes: ${HIPPOCAMPUS_PDF_VISUAL_MAX_DOCUMENT_ENCODED_IMAGE_BYTES:2000000000}
        structure:
          max-outline-items: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_OUTLINE_ITEMS:4096}
          max-outline-depth: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_OUTLINE_DEPTH:16}
          max-text-positions-per-page: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_TEXT_POSITIONS_PER_PAGE:100000}
          max-layout-lines-per-page: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_LAYOUT_LINES_PER_PAGE:4096}
          max-candidates-per-document: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_CANDIDATES_PER_DOCUMENT:10000}
          max-nodes-per-document: ${HIPPOCAMPUS_PDF_STRUCTURE_MAX_NODES_PER_DOCUMENT:4096}
  security:
    login:
      max-attempts: 60
      window: PT1M
      maximum-tracked-addresses: 1024

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        path: /api

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: unrestricted
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: base
