spring:
  application:
    name: hippocampus-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
  session:
    timeout: ${HIPPOCAMPUS_SESSION_IDLE_TIMEOUT:PT30M}
    jdbc:
      initialize-schema: never

hippocampus:
  security:
    login:
      max-attempts: 60
      window: PT1M
      maximum-tracked-addresses: 1024

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        path: /api

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: unrestricted
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: base
