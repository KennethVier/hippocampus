name: security-monitoring

on:
  schedule:
    - cron: '17 4 * * 1' # Weekly on Monday at 04:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-monitoring
  cancel-in-progress: false

jobs:
  security-monitoring:
    name: security-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate Gitleaks detects an isolated synthetic fixture
        run: |
          set -euo pipefail

          fixture_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$fixture_dir"
          }
          trap cleanup EXIT

          printf 'token = "%s%s%s"\n' \
            'ghp_' \
            'A1b2C3d4E5f6G7h8I9' \
            'J0k1L2m3N4p5Q6r7S8' \
            > "$fixture_dir/fixture.txt"

          set +e
          docker run --rm \
            --volume "$fixture_dir:/fixture:ro" \
            --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir --redact --no-banner --exit-code 42 /fixture
          scan_status=$?
          set -e

          if [ "$scan_status" -ne 42 ]; then
            echo "Gitleaks detector self-test failed with status $scan_status." >&2
            exit 1
          fi

      - name: Scan full Git history for secrets
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --redact --no-banner --exit-code 1 \
            --gitleaks-ignore-path="/repo/.gitleaksignore" \
            --log-opts="--all --no-merges" /repo