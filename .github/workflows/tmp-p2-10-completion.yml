name: Temporary P2-10 completion

on:
  push:
    branches:
      - docs/p2-10-completion

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Mark P2-10 Done with final evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION-TRACKER.md')
          text = path.read_text(encoding='utf-8')
          heading = '## P2-10 — Build Materials UI and upload transfer progress'
          next_heading = '## P2-11 — Harden upload intake baseline'
          start = text.index(heading)
          end = text.index(next_heading, start)
          block = text[start:end]

          old_status = '- **Status:** Ready for Review'
          if block.count(old_status) != 1:
              raise SystemExit('Expected exactly one P2-10 Ready for Review status')
          block = block.replace(old_status, '- **Status:** Done', 1)

          lines = block.splitlines()
          evidence_index = next((i for i, line in enumerate(lines) if line.startswith('- **Evidence / link:** ')), None)
          if evidence_index is None:
              raise SystemExit('P2-10 evidence line not found')

          completion = (
              ' Final completion evidence: implementation PR [#88](https://github.com/KennethVier/hippocampus/pull/88) '
              'at final reviewed head `59fd38497ec4cf6d41d604a2710796b923e44a53` passed authoritative PR quality run '
              '[#209](https://github.com/KennethVier/hippocampus/actions/runs/33541679135) (ID `33541679135`) with '
              '`frontend-quality`, `backend-quality`, `security`, `auth-e2e`, and `phase1-gate` all successful; '
              '`auth-e2e` ran five non-skipped tests, including the Materials upload/open/delete journey on desktop and mobile Chromium. '
              'PR #88 merged into `main` as `53bc051098bd42351726dec9e8f24572440f335d`. Post-merge `main` quality run '
              '[#210](https://github.com/KennethVier/hippocampus/actions/runs/33542761927) (ID `33542761927`) succeeded on that exact merge commit '
              'with `backend-quality`, `frontend-quality`, `auth-e2e`, `security`, and `phase1-gate` successful. The push-run dependency-review step '
              'was skipped and is not counted as passed; introduced-dependency review already passed on PR run #209. External general implementation review '
              'remains **APPROVED**, independent adversarial security review remains **SECURITY PASS**, the upload journey Definition of Done is satisfied, '
              'no current blocker remains, and no ADR or undocumented architecture deviation is required.'
          )
          if 'Final completion evidence: implementation PR [#88]' in lines[evidence_index]:
              raise SystemExit('P2-10 final completion evidence already present')
          lines[evidence_index] += completion
          block = '\n'.join(lines) + ('\n' if block.endswith('\n') else '')
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')

      - name: Remove temporary workflow and commit tracker-only completion
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p2-10-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION-TRACKER.md .github/workflows/tmp-p2-10-completion.yml
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/tmp-p2-10-completion.yml docs/IMPLEMENTATION-TRACKER.md "
          git commit -m "docs: mark P2-10 complete"
          git push origin HEAD:docs/p2-10-completion
