name: quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: hippocampus
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus -d hippocampus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    env:
      HIPPOCAMPUS_POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests, architecture tests, migrations, and build
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan explicit commit range for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "$zero_sha" ]; then
                first_commit="$(git rev-list --max-parents=0 "$CURRENT_SHA")"
                scan_range="${first_commit}..${CURRENT_SHA}"
              else
                scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              parent_commit="$(git rev-parse "${CURRENT_SHA}^" 2>/dev/null || true)"
              if [ -n "$parent_commit" ]; then
                scan_range="${parent_commit}..${CURRENT_SHA}"
              else
                scan_range="$CURRENT_SHA"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "Scanning commit range: $scan_range"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges $scan_range" /repo

      - name: Review introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4.6.0
        with:
          fail-on-severity: high
