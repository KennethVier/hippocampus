name: quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests, architecture tests, migrations, and build
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  auth-e2e:
    name: auth-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: hippocampus
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus -d hippocampus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend for E2E
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: Start backend and wait for readiness
        env:
          SPRING_PROFILES_ACTIVE: local
          HIPPOCAMPUS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          HIPPOCAMPUS_POSTGRES_PORT: '5432'
          HIPPOCAMPUS_POSTGRES_USER: hippocampus
          HIPPOCAMPUS_POSTGRES_PASSWORD: hippocampus
        run: |
          set -euo pipefail
          jar="$(find backend/target -maxdepth 1 -name 'hippocampus-backend-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$jar"
          nohup java -jar "$jar" >/tmp/hippocampus-backend.log 2>&1 &
          echo $! >/tmp/hippocampus-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/hippocampus-backend.pid)" 2>/dev/null; then
              cat /tmp/hippocampus-backend.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/hippocampus-backend.log
          exit 1

      - name: Provision isolated E2E accounts
        working-directory: backend
        run: |
          set -euo pipefail
          ./mvnw -q -DincludeScope=runtime dependency:build-classpath -Dmdep.outputFile=/tmp/hippocampus-runtime-classpath
          cat >/tmp/HippocampusE2ePasswordHash.java <<'JAVA'
          import org.springframework.security.crypto.factory.PasswordEncoderFactories;
          class HippocampusE2ePasswordHash {
              public static void main(String[] args) {
                  System.out.print(PasswordEncoderFactories.createDelegatingPasswordEncoder().encode(args[0]));
              }
          }
          JAVA
          CLASSPATH="$(cat /tmp/hippocampus-runtime-classpath):target/classes"
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=pgvector/pgvector:0.8.6-pg18 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          previous_user_id=
          for label in A B; do
            email="e2e-${label,,}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
            password="$(openssl rand -hex 24)"
            user_id="$(python -c 'import uuid; print(uuid.uuid4())')"
            test -z "$previous_user_id" || test "$user_id" != "$previous_user_id"
            previous_user_id="$user_id"
            echo "::add-mask::$password"
            password_hash="$(java -cp "$CLASSPATH" /tmp/HippocampusE2ePasswordHash.java "$password")"
            echo "::add-mask::$password_hash"
            docker exec -i "$POSTGRES_CONTAINER" psql -U hippocampus -d hippocampus \
              -v ON_ERROR_STOP=1 \
              -v user_id="$user_id" \
              -v email="$email" \
              -v password_hash="$password_hash" <<'SQL'
          INSERT INTO users (id, email, display_name, status, created_at, updated_at)
          VALUES (:'user_id'::uuid, :'email', 'E2E Student', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          INSERT INTO user_password_credentials (user_id, password_hash, created_at, updated_at)
          VALUES (:'user_id'::uuid, :'password_hash', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          SQL
            {
              echo "HIPPOCAMPUS_E2E_USER_${label}_EMAIL=$email"
              echo "HIPPOCAMPUS_E2E_USER_${label}_PASSWORD=$password"
              echo "HIPPOCAMPUS_E2E_USER_${label}_ID=$user_id"
            } >> "$GITHUB_ENV"
          done

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real authentication journey
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-auth-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/hippocampus-backend.log || true

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan explicit commit range for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "$zero_sha" ]; then
                first_commit="$(git rev-list --max-parents=0 "$CURRENT_SHA")"
                scan_range="${first_commit}..${CURRENT_SHA}"
              else
                scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              parent_commit="$(git rev-parse "${CURRENT_SHA}^" 2>/dev/null || true)"
              if [ -n "$parent_commit" ]; then
                scan_range="${parent_commit}..${CURRENT_SHA}"
              else
                scan_range="$CURRENT_SHA"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "Scanning commit range: $scan_range"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges $scan_range" /repo

      - name: Review introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4.6.0
        with:
          fail-on-severity: high

  phase1-gate:
    name: phase1-gate
    if: ${{ always() }}
    needs:
      - backend-quality
      - frontend-quality
      - auth-e2e
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Require every Phase 1 acceptance input
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          AUTH_E2E_RESULT: ${{ needs.auth-e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$AUTH_E2E_RESULT" = success
          test "$SECURITY_RESULT" = success
