name: P3-04 completion tracker update

on:
  push:
    branches:
      - docs/p3-04-completion

permissions:
  contents: write

jobs:
  update-tracker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: docs/p3-04-completion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record P3-04 completion evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/IMPLEMENTATION-TRACKER.md")
          text = path.read_text()

          start_marker = "## P3-04 — Implement PDF metadata/native text extraction"
          end_marker = "## P3-05 — Create DocumentNode/TextBlock schema"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]

          old_status = "- **Status:** Ready for Review"
          if section.count(old_status) != 1:
              raise SystemExit("Expected exactly one P3-04 Ready for Review status")
          section = section.replace(old_status, "- **Status:** Done", 1)

          evidence_prefix = "- **Evidence / link:** "
          evidence_lines = [line for line in section.splitlines() if line.startswith(evidence_prefix)]
          if len(evidence_lines) != 1:
              raise SystemExit(f"Expected exactly one P3-04 evidence line, found {len(evidence_lines)}")

          final_evidence = (
              "- **Evidence / link:** P3-04 bounded PDF metadata/native-text extraction was implemented in PR "
              "[#103](https://github.com/KennethVier/hippocampus/pull/103). The final reviewed implementation head "
              "`6f08ce4b0ed3c22285734227f152a935c40186e0` provides the framework-free `ExtractPdfNativeText` capability, "
              "authoritative current MaterialVersion source resolution, provider-neutral `BinaryObjectStore` staging to backend-generated "
              "temporary files, staged-byte Tika MIME reinspection, PDFBox 3.0.8 file-backed loading, immutable 1-based page/batch contracts, "
              "configurable page/batch/native-text resource limits, bounded-writer enforcement during `PDFTextStripper` output, typed fail-closed "
              "handling for missing/deleted/non-PDF sources, partial downloads, MIME mismatch, encrypted/corrupt PDFs, page/resource limits, sink "
              "failure, and cleanup failure, plus a permanent ArchUnit rule preventing PDF/persistence/inspection/storage adapters from depending "
              "upward on application. Deterministic tests cover a five-page native PDF including a blank page/final partial batch and a runtime-generated "
              "601-page PDF consumed incrementally in 19 batches at batch size 32 with a final 25-page batch, without a whole-file byte array, "
              "whole-document String, or retained all-page collection. Exact-final-head PR quality run "
              "[#267](https://github.com/KennethVier/hippocampus/actions/runs/33741615289) (ID `33741615289`) completed successfully on "
              "`6f08ce4b0ed3c22285734227f152a935c40186e0` with `backend-quality`, `frontend-quality`, `security`, `auth-e2e`, `phase1-gate`, and "
              "`phase2-gate` all successful; its PR security job passed explicit commit-range secret scanning and introduced-dependency review for "
              "PDFBox. Final external general implementation review verdict is **APPROVED** (review ID `5102649199`) and the independent adversarial "
              "security review verdict is **SECURITY PASS** (review ID `5102660863`), with no unresolved blocking finding in P3-04 scope. PR #103 "
              "merged into `main` as `86064e39accd51fd8a24c7c55a8e12b832716621`. Post-merge `main` quality run "
              "[#268](https://github.com/KennethVier/hippocampus/actions/runs/33765026056) (ID `33765026056`) completed successfully on that exact "
              "merge commit with `backend-quality`, `frontend-quality`, `security`, `auth-e2e`, `phase1-gate`, and `phase2-gate` all successful. "
              "The post-merge push-run introduced-dependency-review step was skipped and is not counted as passed; the applicable introduced-dependency "
              "review passed on PR run #267. P3-04 Definition of Done is satisfied: native fixture output, ordered bounded extraction, the 601-page "
              "large-PDF case, resource/failure behavior, provider-neutral staging, architecture direction, and exact-head/post-merge validation are green. "
              "External review explicitly approved the P3-04/P3-05 ownership boundary: P3-04 completes the bounded extraction/sink capability, while durable "
              "`DocumentNode`/`TextBlock` persistence, page-count persistence in the real extraction flow, and production `MATERIAL_EXTRACT` handler "
              "registration remain P3-05-owned. No migration, raw extraction-artifact architecture, OCR/classification/normalization/visual/chunk/progress "
              "scope leakage, undocumented architecture deviation, or blocker remains, and ADR is not required. P3-05 remains `Not Started`; Phase 3 "
              "remains unevaluated because P3-18 owns the phase gate."
          )
          section = section.replace(evidence_lines[0], final_evidence, 1)

          notes_lines = [line for line in section.splitlines() if line.startswith("- **Notes / blockers:**")]
          if len(notes_lines) != 1:
              raise SystemExit(f"Expected exactly one P3-04 notes line, found {len(notes_lines)}")
          section = section.replace(notes_lines[0], "- **Notes / blockers:** _None_", 1)

          text = text[:start] + section + text[end:]
          path.write_text(text)

      - name: Commit tracker-only completion update
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p3-04-completion-tracker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION-TRACKER.md .github/workflows/p3-04-completion-tracker.yml
          git commit -m "docs: mark P3-04 complete"
          git push origin HEAD:docs/p3-04-completion
