name: P2-09 tracker completion helper

on:
  push:
    branches:
      - chore/p2-09-completion

permissions:
  contents: write

jobs:
  complete-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/p2-09-completion
          fetch-depth: 1

      - name: Patch only P2-09 completion evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION-TRACKER.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## P2-09 — Build Subjects and Topics UI'
          end_marker = '## P2-10 — Build Materials UI and upload transfer progress'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = block.splitlines()

          evidence = (
              '- **Evidence / link:** Implementation PR [#84](https://github.com/KennethVier/hippocampus/pull/84) '
              'delivered the responsive authenticated `/subjects` Subject CRUD/pagination screen and `/subjects/:subjectId` '
              'Subject context with ACTIVE-parent-gated Topic CRUD/pagination, using the feature-local `learning-organization` '
              'boundary, TanStack Query server state, centralized CSRF-capable `apiClient`, runtime Zod response validation, '
              'separate RHF/Zod Subject/Topic forms, existing accessible UI primitives, and token-based responsive styling. '
              'The reviewed implementation keeps `/topics/:topicId` as a placeholder, exposes no Subject sort-order control '
              '(create sends `sortOrder: null`; update preserves the authoritative loaded value), does not query or mutate Topics '
              'for an owned archived Subject, and leaves Subtopics, Study Missions, Materials, AI/RAG, Tailwind, backend changes, '
              'global server-state, and P2-10+ outside scope. Initial PR run #196 (`33484201179`) exposed an ambiguous Playwright '
              'heading locator; later run #199 (`33486002845`) exposed a React Strict Mode dialog-composition defect during the real '
              'CRUD journey. Both and the external-review form/error/API-test findings were remediated before final approval. Final '
              'reviewed PR head `434104486b5f07095b8f2c64282e1d34ea8c8994` passed authoritative PR quality run '
              '[#201](https://github.com/KennethVier/hippocampus/actions/runs/33486517691) (ID `33486517691`) with '
              '`frontend-quality`, `backend-quality`, automated `security`, `auth-e2e`, and `phase1-gate` all successful. '
              '`frontend-quality` passed locked install, lint, typecheck, the full Vitest/RTL suite, production build, and npm audit; '
              'the PR `security` job passed explicit commit-range secret scanning and introduced-dependency review. The real browser '
              'job ran three non-skipped tests: the existing authoritative two-session isolation journey plus the full P2-09 '
              'organization CRUD journey on desktop Chromium and mobile Chromium. External general implementation re-review verdict: '
              '**APPROVED**. Independent adversarial security review verdict: **SECURITY PASS** for the P2-09 changed surface, after '
              'review of protected-route/session boundaries, centralized cookie/CSRF handling, server-authoritative ownership/BOLA '
              'assumptions, UUID/path handling, foreign/missing concealment, archived-parent gating, XSS-safe React text rendering, '
              'absence of private browser persistence, runtime response validation, safe errors, and the introduced dependencies; the '
              'final verdict is recorded in PR review ID `5076656122`. GitHub formal self-approval was unavailable because the '
              'connected account is the PR author; that platform restriction is not counted as a review failure. PR #84 merged into '
              '`main` as `c0ccba23353f80b1c3d35992f3aa060852bba47b`. Post-merge `main` quality run '
              '[#202](https://github.com/KennethVier/hippocampus/actions/runs/33495646422) (ID `33495646422`) succeeded on that exact '
              'merge commit with `backend-quality`, `frontend-quality`, `auth-e2e`, `security`, and `phase1-gate` successful. The '
              'push-run dependency-review step was skipped and is not counted as passed; introduced-dependency review already passed '
              'on PR run #201. The expected student organization behavior is established, the desktop/mobile CRUD Definition of Done '
              'is satisfied, no ADR or undocumented architecture deviation is required, and no current blocker remains.'
          )

          status_replaced = evidence_replaced = notes_replaced = False
          for i, line in enumerate(lines):
              if line == '- **Status:** Ready for Review':
                  lines[i] = '- **Status:** Done'
                  status_replaced = True
              elif line.startswith('- **Evidence / link:**'):
                  lines[i] = evidence
                  evidence_replaced = True
              elif line.startswith('- **Notes / blockers:**'):
                  lines[i] = '- **Notes / blockers:** _None_'
                  notes_replaced = True

          if not (status_replaced and evidence_replaced and notes_replaced):
              raise SystemExit('P2-09 tracker block did not match expected Ready-for-Review shape')

          replacement = '\n'.join(lines)
          if block.endswith('\n'):
              replacement += '\n'
          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY
          rm .github/workflows/p2-09-tracker-completion.yml
          git diff --check

      - name: Commit completion evidence and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-TRACKER.md .github/workflows/p2-09-tracker-completion.yml
          git commit -m 'Complete P2-09 tracker evidence'
          git push origin HEAD:chore/p2-09-completion
