name: ai-live-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider smoke test to run
        required: true
        default: both
        type: choice
        options:
          - both
          - gemini
          - ollama-cloud

permissions:
  contents: read

concurrency:
  group: ai-live-smoke
  cancel-in-progress: false

jobs:
  gemini-live-smoke:
    name: gemini-live-smoke
    if: ${{ inputs.provider == 'both' || inputs.provider == 'gemini' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Require Gemini smoke configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIPPOCAMPUS_GEMINI_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_GEMINI_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "Gemini live smoke NOT RUN: GEMINI_API_KEY is unavailable." >&2; exit 1; }
          test -n "$HIPPOCAMPUS_GEMINI_SMOKE_MODEL" || { echo "Gemini live smoke NOT RUN: HIPPOCAMPUS_GEMINI_SMOKE_MODEL is unavailable." >&2; exit 1; }

      - name: Run one structured Gemini smoke task
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_SMOKE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIPPOCAMPUS_GEMINI_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_GEMINI_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=GeminiProviderLiveSmokeTests test

  ollama-cloud-live-smoke:
    name: ollama-cloud-live-smoke
    if: ${{ inputs.provider == 'both' || inputs.provider == 'ollama-cloud' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Require Ollama Cloud smoke configuration
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_API_KEY" || { echo "Ollama Cloud live smoke NOT RUN: OLLAMA_API_KEY is unavailable." >&2; exit 1; }
          test -n "$HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL" || { echo "Ollama Cloud live smoke NOT RUN: HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL is unavailable." >&2; exit 1; }

      - name: Run one structured Ollama Cloud smoke task
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_SMOKE: 'true'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=OllamaCloudProviderLiveSmokeTests test
