name: ai-live-smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live AI validation suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - p7-golden
      provider:
        description: Provider smoke test to run
        required: true
        default: both
        type: choice
        options:
          - both
          - gemini
          - ollama-cloud
      task:
        description: Golden task family to run
        required: true
        default: all
        type: choice
        options:
          - all
          - explanation
          - question-generation
          - response-evaluation

permissions:
  contents: read

concurrency:
  group: ai-live-smoke
  cancel-in-progress: false

jobs:
  gemini-live-smoke:
    name: gemini-live-smoke
    if: ${{ inputs.provider == 'both' || inputs.provider == 'gemini' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Require Gemini smoke configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIPPOCAMPUS_GEMINI_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_GEMINI_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "Gemini live smoke NOT RUN: GEMINI_API_KEY is unavailable." >&2; exit 1; }
          test -n "$HIPPOCAMPUS_GEMINI_SMOKE_MODEL" || { echo "Gemini live smoke NOT RUN: HIPPOCAMPUS_GEMINI_SMOKE_MODEL is unavailable." >&2; exit 1; }

      - name: Run one structured Gemini smoke task
        if: ${{ inputs.suite == 'smoke' }}
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_SMOKE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIPPOCAMPUS_GEMINI_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_GEMINI_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=GeminiProviderLiveSmokeTests test

      - name: Run P7 Gemini Golden evaluation
        if: ${{ inputs.suite == 'p7-golden' }}
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_GOLDEN: 'true'
          HIPPOCAMPUS_LIVE_AI_GOLDEN_PROVIDER: gemini
          HIPPOCAMPUS_LIVE_AI_GOLDEN_TASK: ${{ inputs.task }}
          HIPPOCAMPUS_LIVE_AI_GOLDEN_DELAY_MS: '15000'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIPPOCAMPUS_GEMINI_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_GEMINI_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=GoldenAiLiveEvaluationRunner test

      - name: Upload Gemini Golden evaluation report
        if: ${{ always() && inputs.suite == 'p7-golden' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-golden-gemini
          path: backend/target/ai-golden-evaluation/
          if-no-files-found: error

  ollama-cloud-live-smoke:
    name: ollama-cloud-live-smoke
    if: ${{ inputs.provider == 'both' || inputs.provider == 'ollama-cloud' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Require Ollama Cloud smoke configuration
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_API_KEY" || { echo "Ollama Cloud live smoke NOT RUN: OLLAMA_API_KEY is unavailable." >&2; exit 1; }
          test -n "$HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL" || { echo "Ollama Cloud live smoke NOT RUN: HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL is unavailable." >&2; exit 1; }

      - name: Run one structured Ollama Cloud smoke task
        if: ${{ inputs.suite == 'smoke' }}
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_SMOKE: 'true'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=OllamaCloudProviderLiveSmokeTests test

      - name: Run P7 Ollama Cloud Golden evaluation
        if: ${{ inputs.suite == 'p7-golden' }}
        working-directory: backend
        env:
          HIPPOCAMPUS_LIVE_AI_GOLDEN: 'true'
          HIPPOCAMPUS_LIVE_AI_GOLDEN_PROVIDER: ollama-cloud
          HIPPOCAMPUS_LIVE_AI_GOLDEN_TASK: ${{ inputs.task }}
          HIPPOCAMPUS_LIVE_AI_GOLDEN_DELAY_MS: '0'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL: ${{ vars.HIPPOCAMPUS_OLLAMA_CLOUD_SMOKE_MODEL }}
        run: ./mvnw -B -ntp -Dtest=GoldenAiLiveEvaluationRunner test

      - name: Upload Ollama Cloud Golden evaluation report
        if: ${{ always() && inputs.suite == 'p7-golden' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-golden-ollama-cloud
          path: backend/target/ai-golden-evaluation/
          if-no-files-found: error
